spec:
  replicas:
    max: 4
  ingresses:
    - https://pam-stilling-feed.intern.nav.no/
    - https://pam-stilling-feed.nav.no/
  gcp:
    sqlInstances:
      - name: pam-stilling-feed
        type: POSTGRES_18
        diskType: SSD
        highAvailability: true
        diskSize: 50
        diskAutoresize: true
        tier: db-custom-4-7680
        databases:
          - name: pamstillingfeed
            envVarPrefix: DB
        cascadingDelete: false
  kafka:
    pool: nav-prod
  env:
    - name: STILLING_URL_BASE
      value: https://arbeidsplassen.nav.no/stillinger/stilling
