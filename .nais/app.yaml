apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: pam-stilling-feed
  namespace: teampam
  labels:
    team: teampam
spec:
  port: 8080
  liveness:
    path: /internal/isAlive
    initialDelay: 40
  readiness:
    path: /internal/isReady
    initialDelay: 40
  replicas:
    min: 2
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 1200Mi
  leaderElection: true
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  gcp:
    sqlInstances:
      - name: pam-stilling-feed
        type: POSTGRES_18
        diskType: SSD
        highAvailability: true
        diskSize: 50
        diskAutoresize: true
        tier: db-custom-2-7680
        databases:
          - name: pamstillingfeed
            envVarPrefix: DB
        cascadingDelete: false
  accessPolicy:
    inbound:
      rules:
        - application: pam-stilling-feed-admin
  envFrom:
    - secret: pam-stilling-feed-secret
  env:
    - name: STILLING_INTERN_TOPIC
      value: teampam.stilling-intern-1
    - name: STILLING_INTERN_GROUP_ID
      value: StillingFeed3
    - name: TILGANGSSTYRING_ENABLED
      value: "true"
    - name: REKJOR_DETALJER_ENABLED
      value: "false"
    - name: REKJOR_DETALJER_GROUP_ID
      value: pam-stilling-feed-rekjor-2
